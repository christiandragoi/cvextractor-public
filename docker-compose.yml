services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cv-extractor
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///app/data/cv_extractor.db}
      - STORAGE_ROOT=${STORAGE_ROOT:-/app/storage}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
